# ============================================================
# BlindAid v2 Configuration
# CNN-OCR | 3-Phase ML | MySQL | Multi-thread Pipeline
# ============================================================

# ----------------------------
# Database Settings
# ----------------------------
database:
  host:                "127.0.0.1"
  port:                3306
  user:                "root"
  password:            ""         # Set your MySQL password here
  db_name:             "blindaid"
  use_sqlite_fallback: true       # Use SQLite if MySQL unreachable (dev mode)

# ----------------------------
# Pipeline Settings
# ----------------------------
pipeline:
  camera_queue_size:   3    # Bounded frame queue (drops oldest if full)
  result_queue_size:   5    # Bounded result queue
  inference_threads:   1    # Number of inference workers (1 for CPU)

# ----------------------------
# Display Settings (replaces voice)
# ----------------------------
display:
  show_nav_panel:       true   # Bottom navigation instruction strip
  show_ocr_sidebar:     true   # Right-side OCR text panel
  nav_panel_lines:      3      # Max nav instructions shown
  ocr_sidebar_lines:    7      # Max OCR entries shown
  show_top_bar:         true   # Status bar (FPS, DB, RL action)

# ----------------------------
# OCR Settings
# ----------------------------
ocr:
  enabled:              true
  engine:               "auto"    # "auto" = CRNN if trained, else EasyOCR
  min_confidence:       0.20      # Low threshold to capture small text on bottles/books
  scan_interval_frames: 1         # Run OCR on every frame for immediate detection
  fuzzy_threshold:      80        # Minimum rapidfuzz score for word matching

# ----------------------------
# Model Settings
# ----------------------------
model:
  weights:               "yolov8n.pt"   # Base YOLO; override with custom model below
  custom_weights:        "models/blindaid_supervised.pt"  # Fine-tuned model (when available)
  confidence_threshold:  0.38
  iou_threshold:         0.45
  image_size:            640
  device:                "cpu"          # Use "0" for GPU

  # Per-class confidence overrides
  class_confidence_overrides:
    0:  0.42   # person
    15: 0.60   # cat
    16: 0.60   # dog

  # Temporal filter (1 = instant; 3 = needs 3 frames to confirm)
  temporal_filter_frames: 1

# ----------------------------
# Navigation-Relevant COCO Classes
# ----------------------------
active_classes:
  - 0    # person
  - 1    # bicycle
  - 2    # car
  - 3    # motorcycle
  - 5    # bus
  - 7    # truck
  - 9    # traffic light
  - 11   # stop sign
  - 13   # bench
  - 15   # cat
  - 16   # dog
  - 24   # backpack
  - 26   # handbag
  - 28   # suitcase
  - 39   # bottle
  - 56   # chair
  - 57   # couch
  - 58   # potted plant
  - 59   # bed
  - 60   # dining table
  - 62   # tv
  - 63   # laptop
  - 67   # cell phone
  - 73   # book
  - 75   # vase

# ----------------------------
# Custom Classes (after fine-tuning)
# These extend COCO classes:
# ----------------------------
custom_classes:
  - "door"
  - "stairs"
  - "elevator"
  - "exit_sign"
  - "ramp"
  - "sign"

# ----------------------------
# Spatial Analysis Settings
# ----------------------------
spatial:
  left_zone_end:       0.38
  right_zone_start:    0.62
  critical_size:       0.18
  near_size:           0.07
  far_size:            0.01

# ----------------------------
# Path Analyzer Settings
# ----------------------------
path:
  walkable_zone_top:          0.35
  corridor_blocked_threshold: 0.25
  corridor_caution_threshold: 0.10
  overlay_alpha:              0.30
  show_path_overlay:          true
  path_announce_interval:     4.0

# ----------------------------
# Camera / Video Settings
# ----------------------------
camera:
  source:           0        # 0 = default webcam
  target_fps:       30       # Target camera framerate
  display_overlay:  true     # Show OpenCV window
  overlay_width:    1280
  overlay_height:   720

# ----------------------------
# Priority Rules
# ----------------------------
priority:
  critical_objects:
    - "car"
    - "truck"
    - "bus"
    - "motorcycle"
    - "door"          # new custom class
    - "stairs"        # new custom class
  high_objects:
    - "person"
    - "bicycle"
    - "dog"
    - "stop sign"
    - "traffic light"
    - "exit_sign"     # new custom class
  medium_objects:
    - "chair"
    - "bench"
    - "potted plant"
    - "dining table"
    - "ramp"          # new custom class

# ----------------------------
# Reinforcement Learning (Phase 3)
# ----------------------------
rl:
  enabled:        false     # Set true after Phase 3 training
  model_path:     "models/rl_agent.pt"
  epsilon:        0.05      # Exploration rate during inference (exploit mostly)
  gamma:          0.99
  learning_rate:  1e-4

# ----------------------------
# Training Pipeline Settings
# ----------------------------
training:
  # Phase 1: Supervised
  phase1:
    epochs:          50
    batch_size:      8      # CPU-safe batch size
    image_size:      640
    augment:         true
    output_model:    "models/blindaid_supervised.pt"

  # Phase 2: Unsupervised
  phase2:
    simclr_epochs:   10
    scene_enc_epochs: 15
    n_clusters:      20
    dbscan_eps:      0.5

  # Phase 3: RL
  phase3:
    episodes:        500
    buffer_size:     50000
    target_update:   500
    batch_size:      64

# ----------------------------
# Internet Data Fetching
# ----------------------------
data_fetch:
  youtube:
    enabled:       true
    max_videos:    5
    max_duration:  300       # Max video length in seconds
    queries:
      - "indoor navigation first person"
      - "blind person walking indoor"
      - "shopping mall corridor walk"

  roboflow:
    enabled:       true
    api_key:       ""        # Optional; public datasets work without key
    datasets:
      - "doors"
      - "stairs"
      - "exit_signs"

  openimages:
    enabled:       true
    max_samples:   200
    classes:
      - "Door"
      - "Stairs"
      - "Person"
      - "Chair"
      - "Traffic sign"

  ocr_datasets:
    enabled:       true
    datasets:
      - "iiit5k"
      - "svt"

# ----------------------------
# Navigation Settings
# ----------------------------
navigation:
  map_image:             "data/floorplan.jpg"
  step_repeat_interval:  6.0
